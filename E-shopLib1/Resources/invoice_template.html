<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приходная накладная</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 20px;
            background: white;
            font-size: 14pt;
            line-height: 1.3;
        }
        
        .invoice-container {
            width: 100%;
            max-width: 210mm;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
            background: white;
        }
        
        .invoice-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
        }
        
        .invoice-title {
            font-size: 18pt;
            font-weight: bold;
            margin: 0 0 15px 0;
            text-transform: uppercase;
        }
        
        .invoice-number {
            font-size: 14pt;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .invoice-date {
            font-size: 12pt;
            margin: 5px 0;
        }
        
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 11pt;
            border: 2px solid #000;
        }
        
        .items-table th {
            border: 1px solid #000;
            padding: 8px 4px;
            text-align: center;
            background-color: #f0f0f0;
            font-weight: bold;
            font-size: 10pt;
        }
        
        .items-table td {
            border: 1px solid #000;
            padding: 8px 4px;
            text-align: center;
            font-size: 10pt;
        }
        
        .total-section {
            text-align: right;
            font-size: 12pt;
            font-weight: bold;
            margin: 30px 0;
            padding: 15px 0;
            border-top: 2px solid #000;
        }
        
        .signature-section {
            margin-top: 60px;
            text-align: right;
        }
        
        .signature-line {
            margin-top: 40px;
            border-bottom: 1px solid #000;
            width: 250px;
            display: inline-block;
        }
        
        .signature-label {
            margin-top: 5px;
            font-style: italic;
            font-size: 10pt;
        }
        
        .amount-cell {
            white-space: nowrap;
            text-align: right;
            padding-right: 10px !important;
        }
        
        .text-left {
            text-align: left !important;
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <div class="invoice-header">
            <h1 class="invoice-title">ПРИХОДНАЯ НАКЛАДНАЯ</h1>
            <div class="invoice-number">№ {{SERIAL_NUMBER}}</div>
            <div class="invoice-date">Дата: {{INVOICE_DATE}}</div>
        </div>

        <table class="items-table">
            <thead>
                <tr>
                    <th style="width: 12%">Артикул</th>
                    <th style="width: 25%">Наименование</th>
                    <th style="width: 15%">Категория</th>
                    <th style="width: 10%">Количество</th>
                    <th style="width: 12%">Цена</th>
                    <th style="width: 10%">Ед. изм.</th>
                    <th style="width: 16%">Сумма</th>
                </tr>
            </thead>
            <tbody>
                {{ITEMS_ROWS}}
            </tbody>
        </table>

        <div class="total-section">
            Общая сумма накладной: {{TOTAL_AMOUNT}} руб.
        </div>

        <div class="signature-section">
            <div class="signature-line"></div>
            <div class="signature-label">(подпись)</div>
        </div>
    </div>
</body>
</html>
