<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приходная накладная</title>
    <style>
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            
            .invoice-container {
                margin: 0 auto !important;
                padding: 15mm !important;
                box-shadow: none !important;
            }
        }
        
        body {
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 20px;
            background: white;
            display: flex;
            justify-content: center;
        }
        
        .invoice-container {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 20mm;
            box-sizing: border-box;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .invoice-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
        }
        
        .invoice-title {
            font-size: 24pt;
            font-weight: bold;
            margin: 0;
            text-transform: uppercase;
            line-height: 1.2;
        }
        
        .invoice-number {
            font-size: 18pt;
            font-weight: bold;
            margin: 15px 0;
            line-height: 1.2;
        }
        
        .invoice-date {
            font-size: 14pt;
            margin: 10px 0;
            line-height: 1.2;
        }
        
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 12pt;
            border: 2px solid #000;
        }
        
        .items-table th {
            border: 1px solid #000;
            padding: 10px 5px;
            text-align: center;
            background-color: #f0f0f0;
            font-weight: bold;
        }
        
        .items-table td {
            border: 1px solid #000;
            padding: 10px 5px;
            text-align: center;
        }
        
        .total-section {
            text-align: right;
            font-size: 14pt;
            font-weight: bold;
            margin: 40px 0;
            padding: 10px 0;
            line-height: 1.2;
        }
        
        .signature-section {
            margin-top: 80px;
            text-align: right;
        }
        
        .signature-line {
            margin-top: 60px;
            border-bottom: 1px solid #000;
            width: 250px;
            display: inline-block;
        }
        
        .signature-label {
            margin-top: 8px;
            font-style: italic;
            font-size: 11pt;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="invoice-container">
        <!-- Заголовок накладной -->
        <div class="invoice-header">
            <h1 class="invoice-title">ПРИХОДНАЯ НАКЛАДНАЯ</h1>
            <div class="invoice-number">№ GIM33</div>
            <div class="invoice-date">Дата: 18.11.2025</div>
        </div>

        <!-- Таблица с товарами -->
        <table class="items-table">
            <thead>
                <tr>
                    <th>Артикул</th>
                    <th>Наименование</th>
                    <th>Категория</th>
                    <th>Количество</th>
                    <th>Цена</th>
                    <th>Единица измерения</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>12345</td>
                    <td>Смартфон</td>
                    <td>Техника</td>
                    <td>10</td>
                    <td>1000</td>
                    <td>шт.</td>
                </tr>
            </tbody>
        </table>

        <!-- Общая сумма -->
        <div class="total-section">
            Общая сумма накладной: 10.000 руб
        </div>

        <!-- Подпись -->
        <div class="signature-section">
            <div class="signature-line"></div>
            <div class="signature-label">(подпись)</div>
        </div>
    </div>
</body>
</html>
